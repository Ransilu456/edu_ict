<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogicQuest | IC Logic Chip Diagnostic Bench</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="description"
    content="Direct hardware verification and truth table test bench for TTL 7400-series integrated circuits.">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="src/css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .ic-standalone-nav {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-radius: 0;
    }

    .ic-standalone-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }

    .ic-standalone-mark {
      display: flex;
      gap: 3px;
    }

    .ic-standalone-mark span {
      display: block;
      width: 4px;
      height: 16px;
      background: var(--lime, #bef264);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(190, 242, 100, 0.4);
    }

    .ic-standalone-title {
      font-family: var(--font-header);
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--text-primary);
    }

    .ic-standalone-title span {
      color: var(--lime, #bef264);
    }

    .ic-standalone-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .ic-standalone-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-family: var(--font-header);
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--border-color);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .ic-standalone-btn:hover {
      border-color: var(--lime, #bef264);
      background: rgba(190, 242, 100, 0.1);
    }

    .ic-tester-view {
      display: flex !important;
      flex: 1;
    }
  </style>
</head>

<body>
  <nav class="ic-standalone-nav">
    <a href="/app.html" class="ic-standalone-brand">
      <div class="ic-standalone-mark">
        <span></span><span></span><span></span>
      </div>
      <div class="ic-standalone-title">logic<span>quest</span></div>
    </a>
    <div class="ic-standalone-actions">
      <button class="btn-icon" id="theme-toggle" title="Toggle Light / Dark Theme" aria-label="Toggle Theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <button class="btn-icon" id="audio-toggle" title="Toggle Sound" aria-label="Toggle Sound">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 5L6 9H2v6h4l5 4V5z" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
        </svg>
      </button>
    </div>
  </nav>

  <main id="ic-main-root">
    <section class="view-panel ic-tester-view active" id="ic-tester-view" aria-label="IC Tester Workbench">
      <div class="ic-tester-container">
        <div class="ic-tester-header">
          <div class="ic-header-left">
            <div class="ic-eyebrow">
              <span class="ic-dot"></span>
              <span>HARDWARE WORKBENCH</span>
            </div>
            <h1>IC Chip Diagnostics & Live Tester</h1>
          </div>
          <div class="ic-header-actions">
            <button type="button" class="ic-btn ic-btn-primary" id="ic-run-selftest"
              title="Run automated diagnostic test suite across all gates">
              <span>Run Self-Test</span>
            </button>
            <button type="button" class="ic-btn" id="ic-reset-pins" title="Reset all input pins to LOW">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
              <span>Reset Pins</span>
            </button>
            <button type="button" class="ic-btn ic-btn-accent" id="ic-send-sandbox"
              title="Open tested IC in Sandbox Circuit Builder">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="3" />
                <path d="M8 12h8M12 8v8" />
              </svg>
              <span>Open in Sandbox</span>
            </button>
          </div>
        </div>

        <div class="ic-chip-selector" role="tablist" id="ic-chip-tabs">
          <button type="button" class="ic-chip-tab active" data-ic="7408">
            <span class="ic-tab-code">7408</span>
            <span class="ic-tab-desc">Quad 2-In AND</span>
          </button>
          <button type="button" class="ic-chip-tab" data-ic="7432">
            <span class="ic-tab-code">7432</span>
            <span class="ic-tab-desc">Quad 2-In OR</span>
          </button>
          <button type="button" class="ic-chip-tab" data-ic="7404">
            <span class="ic-tab-code">7404</span>
            <span class="ic-tab-desc">Hex Inverter NOT</span>
          </button>
          <button type="button" class="ic-chip-tab" data-ic="7400">
            <span class="ic-tab-code">7400</span>
            <span class="ic-tab-desc">Quad 2-In NAND</span>
          </button>
          <button type="button" class="ic-chip-tab" data-ic="7402">
            <span class="ic-tab-code">7402</span>
            <span class="ic-tab-desc">Quad 2-In NOR</span>
          </button>
          <button type="button" class="ic-chip-tab" data-ic="7486">
            <span class="ic-tab-code">7486</span>
            <span class="ic-tab-desc">Quad 2-In XOR</span>
          </button>
          <button type="button" class="ic-chip-tab" data-ic="7447">
            <span class="ic-tab-code">7447</span>
            <span class="ic-tab-desc">BCD to 7-Seg</span>
          </button>
        </div>

        <div class="ic-bench-grid">
          <div class="ic-panel ic-package-panel">
            <div class="ic-panel-title">
              <span>DIP Package Pinout</span>
              <div class="ic-view-mode-toggle" id="ic-view-mode-toggle">
                <button type="button" class="ic-mode-btn active" data-mode="package">Package</button>
                <button type="button" class="ic-mode-btn" data-mode="schematic">Real Gate Schematic</button>
              </div>
              <span class="ic-badge" id="ic-package-badge">DIP-14</span>
            </div>
            <div class="ic-package-stage">
              <div class="ic-chip-render" id="ic-chip-render">
                <!-- ic-tester.js -->
              </div>
              <div class="ic-schematic-render" id="ic-schematic-render" style="display: none;">
                <!-- ic-tester.js -->
              </div>
              <div class="ic-sevenseg-preview" id="ic-sevenseg-preview" style="display: none;">
                <div class="ic-sevenseg-title">Target 7-Segment Output</div>
                <div class="ic-sevenseg-box">
                  <svg viewBox="0 0 50 80" class="ic-sevenseg-svg" id="ic-tester-sevenseg-svg">
                    <polygon id="ic-seg-a" class="seven-seg-segment" points="10,8 40,8 36,13 14,13" />
                    <polygon id="ic-seg-f" class="seven-seg-segment" points="8,10 13,14 13,38 8,42" />
                    <polygon id="ic-seg-b" class="seven-seg-segment" points="37,14 42,10 42,42 37,38" />
                    <polygon id="ic-seg-g" class="seven-seg-segment" points="11,40 39,40 35,44 15,44" />
                    <polygon id="ic-seg-e" class="seven-seg-segment" points="8,44 13,46 13,70 8,74" />
                    <polygon id="ic-seg-c" class="seven-seg-segment" points="37,46 42,44 42,74 37,70" />
                    <polygon id="ic-seg-d" class="seven-seg-segment" points="10,72 14,77 36,77 40,72" />
                  </svg>
                  <div class="ic-sevenseg-val" id="ic-sevenseg-val">0</div>
                </div>
              </div>
            </div>
            <div class="ic-package-tip">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="16" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12.01" y2="8" />
              </svg>
              <span>Click any input pin to toggle between 0 (LOW) and 1 (HIGH). Output pins update automatically.</span>
            </div>
          </div>

          <div class="ic-panel ic-analysis-panel">
            <div class="ic-subtabs">
              <button type="button" class="ic-subtab active" data-view="gates">Internal Gates Status</button>
              <button type="button" class="ic-subtab" data-view="table">Truth Table & Diagnostics</button>
            </div>

            <div class="ic-subview ic-gates-subview" id="ic-gates-view">
              <div class="ic-gates-grid" id="ic-gates-grid">
                <!-- ic-tester.js -->
              </div>
            </div>

            <div class="ic-subview ic-table-subview" id="ic-table-view" style="display: none;">
              <div class="ic-table-header-info">
                <div class="ic-diag-status" id="ic-diag-status">
                  <span class="ic-status-dot"></span>
                  <span id="ic-diag-text">Ready for testing. Click any row or run Self-Test.</span>
                </div>
              </div>
              <div class="ic-table-wrap">
                <table class="ic-truth-table" id="ic-truth-table">
                  <!-- ic-tester.js -->
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import './src/js/common.js';
    import { initICTester } from './src/js/sandbox/ic-tester.js';

    window.navigateToRoute = function (route) {
      window.location.href = `/app.html?route=${encodeURIComponent(route)}`;
    };

    document.addEventListener('DOMContentLoaded', () => {
      initICTester();
    });
  </script>
</body>

</html>
