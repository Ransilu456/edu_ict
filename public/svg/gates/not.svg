<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 40 140" width="200" height="96" class="logic-gate-symbol and-gate">

  <defs>
    <style>
      .pinA { stroke: #38bdf8; } /* Cyan - Input A */
      .pinB { stroke: #a855f7; } /* Purple - Input B */
      .pinY { stroke: #22c55e; } /* Green - Output Y */
      .gate { stroke: #64748b; fill: rgba(56, 189, 248, 0.12); } /* Gray gate body */
    </style>
  </defs>

  <!-- Input -->
  <line x1="-20" y1="16" x2="8" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="pinA"/>

  <!-- Gate -->
  <polygon points="8,5 28,16 8,27" fill="var(--gate-fill, rgba(56, 189, 248, 0.12))" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="31" cy="16" r="2.6" fill="var(--gate-bubble-bg, #05080c)" stroke="currentColor" stroke-width="1.6" class="pinY"/>
 
  <!-- Output -->
  <line x1="33" y1="16" x2="40" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="pinB"/>
  <line x1="33" y1="16" x2="125" y2="16"
  stroke="currentColor"   stroke-width="1.8"   stroke-linecap="round" class="pinB" />
  <line x1="125" y1="16" x2="125" y2="45" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="pinB"/>
  <line x1="-20" y1="40" x2="125" y2="40"
  stroke="currentColor"   stroke-width="1.8"   stroke-linecap="round" class="pinB" />
</svg>
