<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 40 140" width="200" height="96" class="logic-gate-symbol or-gate">
  <defs>
    <style>
      .pinA { stroke: #38bdf8; filter: drop-shadow(0 0 2.5px rgba(56, 189, 248, 0.8)); } /* Cyan - Input A */
      .pinB { stroke: #a855f7; filter: drop-shadow(0 0 2.5px rgba(168, 85, 247, 0.8)); } /* Purple - Input B */
      .pinY { stroke: #22c55e; filter: drop-shadow(0 0 3px rgba(34, 197, 94, 0.85)); }   /* Green - Output Y */
      .gate { stroke: currentColor; fill: var(--gate-fill, rgba(56, 189, 248, 0.12)); filter: drop-shadow(0 0 3.5px rgba(56, 189, 248, 0.45)); }
    </style>
  </defs>

  <!-- Top Line-->
  <line x1="-80" y1="8" x2="6" y2="8" class="pinA" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="-20" y1="-3" x2="-20" y2="8" class="pinA" stroke-width="1.8"/>
  <line x1="-20" y1="-3" x2="105" y2="-3" class="pinA" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="105" y1="-3" x2="105" y2="15" class="pinA" stroke-width="1.8"/>
  
  <path d="M 5 4 Q 13 16 5 28 Q 20 27 32 16 Q 20 5 5 4 Z" class="gate" stroke-width="1.8" stroke-linejoin="round"/>
 
  <!-- Bottom Line-->
  <line x1="0" y1="24" x2="6" y2="24" class="pinB" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="0" y1="25" x2="0" y2="40" class="pinB" stroke-width="1.8"/>
  <line x1="0" y1="40" x2="120" y2="40" class="pinB" stroke-width="1.8" stroke-linecap="round"/>
  
  <!--Output -->
  <line x1="32" y1="16" x2="48" y2="16" class="pinY" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="48" y1="16" x2="48" y2="65" class="pinY" stroke-width="1.8"/>
  <line x1="120" y1="16" x2="120" y2="65" class="pinY" stroke-width="1.8"/>
  <line x1="-80" y1="65" x2="120" y2="65" class="pinY" stroke-width="1.8" stroke-linecap="round"/>
</svg>
