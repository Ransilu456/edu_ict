<div class="success-modal-overlay" id="custom-alert-modal" style="display:none">
    <div class="success-modal" id="custom-alert-box"
      style="max-width:420px;padding:2rem;text-align:center;position:relative">
      <div class="custom-alert-icon" id="custom-alert-icon"
        style="width:60px;height:60px;margin:0 auto 1rem;background:var(--bg-tertiary);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--color-indigo);font-size:28px;font-weight:700">
        !</div>
      <h3 class="custom-alert-title" id="custom-alert-title"
        style="font-size:1.3rem;margin-bottom:.5rem;font-family:var(--font-header)">Info</h3>
      <p class="custom-alert-msg" id="custom-alert-msg"
        style="color:var(--text-secondary);line-height:1.6;margin-bottom:1.5rem;font-size:0.95rem"></p>
      <div class="custom-alert-buttons" id="custom-alert-buttons"
        style="display:flex;gap:0.75rem;justify-content:center">
        <button class="btn-primary" id="custom-alert-ok-btn"
          style="min-width:100px; padding:.6rem 1.2rem; color:white;">OK</button>
        <button class="btn-secondary" id="custom-alert-cancel-btn"
          style="min-width:100px;padding:.6rem 1.2rem;display:none">Cancel</button>
      </div>
    </div>
  </div>
