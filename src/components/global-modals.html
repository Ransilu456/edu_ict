<div class="success-modal-overlay" id="custom-alert-modal">
  <div class="success-modal custom-alert-box" id="custom-alert-box">
    <button class="modal-close-btn" data-close-modal="custom-alert-modal" title="Close (Esc)">&times;</button>
    <div class="custom-alert-icon" id="custom-alert-icon">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
    </div>
    <h3 class="custom-alert-title" id="custom-alert-title">Info</h3>
    <p class="custom-alert-msg" id="custom-alert-msg"></p>
    <div class="custom-alert-buttons" id="custom-alert-buttons">
      <button class="btn-primary" id="custom-alert-ok-btn">OK</button>
      <button class="btn-secondary" id="custom-alert-cancel-btn">Cancel</button>
    </div>
  </div>
</div>
