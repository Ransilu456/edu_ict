<div class="success-modal-overlay" id="logic-modal">
  <div class="success-modal logic-modal-card">
    <div class="modal-heading-row">
      <h2 class="success-modal-title" id="logic-modal-title">Gate-Level Logic Inside</h2>
      <button class="modal-close-btn" data-close-modal="logic-modal" title="Close (Esc)">&times;</button>
    </div>
    <div id="logic-modal-content">
    </div>
    <div class="modal-actions">
      <button class="btn-primary" id="close-logic-modal" data-close-modal="logic-modal">Close</button>
    </div>
  </div>
</div>

<div class="success-modal-overlay" id="save-modal">
  <div class="success-modal save-modal-card">
    <div class="modal-heading-row">
      <h2 class="success-modal-title">Save Circuit</h2>
      <button class="modal-close-btn" data-close-modal="save-modal" title="Close (Esc)">&times;</button>
    </div>
    <input type="text" id="save-circuit-name" placeholder="Enter circuit name...">
    <div class="modal-actions">
      <button class="btn-secondary" id="cancel-save-btn" data-close-modal="save-modal">Cancel</button>
      <button class="btn-primary" id="confirm-save-btn">Save</button>
    </div>
  </div>
</div>

<div class="success-modal-overlay" id="load-modal">
  <div class="success-modal load-modal-card">
    <div class="modal-heading-row">
      <h2 class="success-modal-title">Load Circuit</h2>
      <button class="modal-close-btn" data-close-modal="load-modal" title="Close (Esc)">&times;</button>
    </div>
    <div id="saved-circuits-list">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancel-load-btn" data-close-modal="load-modal">Close</button>
    </div>
  </div>
</div>
