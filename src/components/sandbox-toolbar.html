<div class="sandbox-toolbar" role="toolbar" aria-label="Circuit controls">
    <button class="sandbox-btn btn-play" id="sandbox-play" title="Run / Pause"><svg viewBox="0 0 24 24"
            fill="currentColor">
            <path d="M8 5v14l11-7z" />
        </svg><span>Run</span></button>
    <button class="sandbox-btn" id="sandbox-speed-btn" title="Simulation Speed (1x, 2x, 4x, 0.5x)"><svg
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        </svg><span>1x</span></button>
    <div class="sandbox-toolbar-divider"></div>
    <button class="sandbox-btn" id="sandbox-clear" title="Clear Canvas"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6l-1 14H6L5 6M10 6V4h4v2" />
        </svg><span>Clear</span></button>
    <button class="sandbox-btn" id="sandbox-truth-btn" title="Generate Truth Table"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M3 9h18M9 21V9" />
        </svg><span>Truth Table</span></button>
    <button class="sandbox-btn" id="sandbox-waveform-btn" title="Toggle Real-Time Waveform Timing Diagram"><svg
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
        </svg><span>Waveform</span></button>
    <button class="sandbox-btn" id="sandbox-bool-btn" title="Generate Circuit from Boolean Expression"><svg
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 5h8a4 4 0 0 1 0 8H7z" />
            <path d="M7 13h8a4 4 0 0 1 0 8H7z" />
        </svg><span>Boolean</span></button>
    <button class="sandbox-btn" id="sandbox-screenshot-btn" title="Export Circuit as Image"><svg viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
            <circle cx="12" cy="13" r="4" />
        </svg><span>Snap</span></button>
    <div class="sandbox-toolbar-divider"></div>
    <button class="sandbox-btn" id="sandbox-save" title="Save Circuit"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
            <polyline points="17 21 17 13 7 13 7 21" />
            <polyline points="7 3 7 8 15 8" />
        </svg><span>Save</span></button>
    <button class="sandbox-btn" id="sandbox-load" title="Load Circuit"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
        </svg><span>Load</span></button>
    <button class="sandbox-btn" id="sandbox-export" title="Export JSON"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
        </svg><span>Export</span></button>
    <button class="sandbox-btn" id="sandbox-import-btn" title="Import JSON"><svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
        </svg><span>Import</span></button>
    <button class="sandbox-btn" id="sandbox-gate-style-btn" title="Toggle Gate Style (Box / ANSI Symbol)"><svg
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M9 17V7l5 5-5 5" />
        </svg><span>Gate: Box</span></button>
    <input type="file" id="sandbox-import-file" accept=".json" hidden>
</div>
