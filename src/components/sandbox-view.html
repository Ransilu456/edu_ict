<section class="view-panel sandbox-view active">
  <div id="sandbox-sidebar-slot"></div>
  
  <div class="sandbox-workspace" id="sandbox-workspace-canvas">

    <svg class="wires-svg" id="sandbox-wires-svg"></svg>

    <div class="sandbox-empty-hint" id="sandbox-empty-hint">
      <div class="empty-hint-icon"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4h6v3h3v6h-3v7H9v-3H6V11h3V4z" />
          <path d="M6 14v-3M18 14v-3" />
        </svg></div>
      <div class="empty-hint-title">Start building</div>
      <div class="empty-hint-text">Drag parts from the left panel, or click one to drop it here.<br>Connect an output
        port to an input port to wire them up.</div>
    </div>

    <div id="sandbox-toolbar-slot"></div>

    <div class="sandbox-waveform-panel" id="sandbox-waveform-panel" style="display:none;">
      <div class="waveform-header">
        <span><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
            style="vertical-align:middle;margin-right:4px">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg> Logic Timing Diagram (Waveform Scope)</span>
        <div style="display:flex;gap:0.4rem;align-items:center;">
          <button class="waveform-clear-btn" id="waveform-clear-btn" title="Clear Traces">Clear</button>
          <button class="waveform-close-btn" id="waveform-close-btn">&times;</button>
        </div>
      </div>
      <canvas id="waveform-canvas" width="600" height="150"></canvas>
    </div>

  </div>
</section>
