<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 32" width="40" height="32" class="logic-gate-symbol nand-gate">
  <!-- Input leads -->
  <line x1="0" y1="8" x2="6" y2="8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="0" y1="24" x2="6" y2="24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- AND gate body -->
  <path d="M 6 4 L 18 4 A 12 12 0 0 1 18 28 L 6 28 Z" fill="var(--gate-fill, rgba(56, 189, 248, 0.12))" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Inversion bubble -->
  <circle cx="32" cy="16" r="2.6" fill="var(--gate-bubble-bg, #05080c)" stroke="currentColor" stroke-width="1.6"/>
  <!-- Output lead -->
  <line x1="34.6" y1="16" x2="40" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
