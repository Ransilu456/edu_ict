<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 32" width="40" height="32" class="logic-gate-symbol nor-gate">
  <!-- Input leads -->
  <line x1="0" y1="8" x2="8" y2="8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="0" y1="24" x2="8" y2="24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- OR gate body -->
  <path d="M 5 4 Q 13 16 5 28 Q 19 27 30 16 Q 19 5 5 4 Z" fill="var(--gate-fill, rgba(56, 189, 248, 0.12))" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Inversion bubble -->
  <circle cx="32.5" cy="16" r="2.5" fill="var(--gate-bubble-bg, #05080c)" stroke="currentColor" stroke-width="1.6"/>
  <!-- Output lead -->
  <line x1="35" y1="16" x2="40" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
